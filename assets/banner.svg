<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ozan Sarsılmaz — Kurfa Core">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0d121f"/>
    </linearGradient>

    <!-- Glowing Waves Gradient -->
    <linearGradient id="waveCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="waveBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Top Laser Edge -->
    <linearGradient id="topLaser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Dot Lattice -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Base Background -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- Top Laser Highlight -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#topLaser)"/>

    <!-- Animated Sine Waves (Flowing Audio & Edge Network) -->
    <g opacity="0.65">
      <!-- Wave 1 -->
      <path fill="none" stroke="url(#waveCyan)" stroke-width="2.5">
        <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
          M -100 240 Q 200 180, 500 240 T 1100 240 T 1400 240;
          M -100 240 Q 200 290, 500 240 T 1100 240 T 1400 240;
          M -100 240 Q 200 180, 500 240 T 1100 240 T 1400 240
        "/>
      </path>

      <!-- Wave 2 -->
      <path fill="none" stroke="url(#waveBlue)" stroke-width="2">
        <animate attributeName="d" dur="11s" repeatCount="indefinite" values="
          M -100 255 Q 250 295, 600 255 T 1200 255 T 1500 255;
          M -100 255 Q 250 205, 600 255 T 1200 255 T 1500 255;
          M -100 255 Q 250 295, 600 255 T 1200 255 T 1500 255
        "/>
      </path>

      <!-- Wave 3 (Accent) -->
      <path fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.4">
        <animate attributeName="d" dur="14s" repeatCount="indefinite" values="
          M -100 230 Q 300 190, 700 230 T 1300 230;
          M -100 230 Q 300 270, 700 230 T 1300 230;
          M -100 230 Q 300 190, 700 230 T 1300 230
        "/>
      </path>
    </g>

    <!-- CONTENT LAYER -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif">
      <!-- Live Status Badge -->
      <g transform="translate(64, 46)">
        <rect width="250" height="28" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#10b981">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="28" y="18" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5">KURFA CORE // ECOSYSTEM</text>
      </g>

      <!-- Name Header -->
      <text x="62" y="132" fill="#f8fafc" font-size="56" font-weight="800" letter-spacing="-1.2">Ozan Sarsılmaz</text>

      <!-- Subtitle -->
      <text x="64" y="172" fill="#e2e8f0" font-size="20" font-weight="600">Software Engineer &amp; Systems Architect</text>
      <text x="64" y="200" fill="#94a3b8" font-size="15" font-weight="400">Designing high-availability edge networks, low-latency audio engines, and native desktop systems.</text>

      <!-- Interactive Specs Badges -->
      <g transform="translate(64, 238)">
        <rect x="0" y="0" width="150" height="36" rx="8" fill="#0a0f1d" stroke="#1e293b"/>
        <circle cx="16" cy="18" r="3.5" fill="#38bdf8"/>
        <text x="28" y="22" fill="#cbd5e1" font-size="12" font-weight="600">Edge Architecture</text>

        <rect x="162" y="0" width="140" height="36" rx="8" fill="#0a0f1d" stroke="#1e293b"/>
        <circle cx="178" cy="18" r="3.5" fill="#60a5fa"/>
        <text x="190" y="22" fill="#cbd5e1" font-size="12" font-weight="600">Audio Engines</text>

        <rect x="314" y="0" width="150" height="36" rx="8" fill="#0a0f1d" stroke="#1e293b"/>
        <circle cx="330" cy="18" r="3.5" fill="#10b981"/>
        <text x="342" y="22" fill="#cbd5e1" font-size="12" font-weight="600">Native Windows</text>
      </g>

      <!-- RIGHT SIDE: Minimal Telemetry HUD Indicator -->
      <g transform="translate(860, 48)">
        <rect width="276" height="226" rx="14" fill="#080c16" stroke="#1e293b" stroke-width="1.2"/>

        <!-- Mini Header -->
        <rect x="0" y="0" width="276" height="34" rx="14" fill="#0c1222"/>
        <rect x="0" y="20" width="276" height="14" fill="#0c1222"/>
        <line x1="0" y1="34" x2="276" y2="34" stroke="#1e293b"/>
        <circle cx="16" cy="17" r="3.5" fill="#475569"/>
        <circle cx="28" cy="17" r="3.5" fill="#475569"/>
        <circle cx="40" cy="17" r="3.5" fill="#475569"/>
        <text x="138" y="21" fill="#64748b" font-family="'Consolas', monospace" font-size="10.5" font-weight="600" text-anchor="middle">edge-status.sys</text>

        <!-- Stats Lines -->
        <g font-family="'Consolas', monospace" font-size="11.5">
          <text x="18" y="62" fill="#38bdf8">&gt; CLUSTER_STATUS</text>
          <text x="18" y="80" fill="#10b981">● 3 NODES OPERATIONAL</text>

          <text x="18" y="112" fill="#64748b">PRIMARY : kurfacore</text>
          <text x="18" y="130" fill="#64748b">FAILOVER: yedek1 / yedek2</text>
          <text x="18" y="148" fill="#64748b">MEDIA   : kurfanova.edge</text>

          <!-- Equalizer in console -->
          <g transform="translate(18, 172)">
            <rect x="0" y="0" width="240" height="36" rx="6" fill="#050811" stroke="#131c31"/>
            <g fill="#38bdf8">
              <rect x="12" y="10" width="5" height="16" rx="1.5"><animate attributeName="height" values="8;24;12;20;8" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="22;6;18;10;22" dur="1.2s" repeatCount="indefinite"/></rect>
              <rect x="22" y="6"  width="5" height="20" rx="1.5"><animate attributeName="height" values="18;10;26;14;18" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="12;20;4;16;12" dur="1.5s" repeatCount="indefinite"/></rect>
              <rect x="32" y="12" width="5" height="14" rx="1.5"><animate attributeName="height" values="24;8;22;14;24" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="6;22;8;16;6" dur="1.1s" repeatCount="indefinite"/></rect>
              <rect x="42" y="8"  width="5" height="18" rx="1.5"><animate attributeName="height" values="10;24;14;26;10" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="20;6;16;4;20" dur="1.4s" repeatCount="indefinite"/></rect>
              <rect x="52" y="14" width="5" height="12" rx="1.5"><animate attributeName="height" values="16;26;8;20;16" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="14;4;22;10;14" dur="1.3s" repeatCount="indefinite"/></rect>
              <rect x="62" y="10" width="5" height="16" rx="1.5"><animate attributeName="height" values="22;12;24;8;22" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="8;18;6;22;8" dur="1.6s" repeatCount="indefinite"/></rect>
              <rect x="72" y="6"  width="5" height="20" rx="1.5"><animate attributeName="height" values="12;22;16;26;12" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="18;8;14;4;18" dur="1.2s" repeatCount="indefinite"/></rect>
              <rect x="82" y="14" width="5" height="12" rx="1.5"><animate attributeName="height" values="26;14;20;10;26" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="4;16;10;20;4" dur="1.4s" repeatCount="indefinite"/></rect>
              <rect x="92" y="8"  width="5" height="18" rx="1.5"><animate attributeName="height" values="14;24;10;22;14" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="16;6;20;8;16" dur="1.5s" repeatCount="indefinite"/></rect>
              <rect x="102" y="12" width="5" height="14" rx="1.5"><animate attributeName="height" values="20;8;26;16;20" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="10;22;4;14;10" dur="1.1s" repeatCount="indefinite"/></rect>
            </g>
            <text x="124" y="22" fill="#38bdf8" font-size="10.5" font-weight="700">RTT: 12ms · 99.9%</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
