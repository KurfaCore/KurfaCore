<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="Kurfa Core — Sistem Telemetrisi ve Bulut Mimarisi">
  <defs>
    <linearGradient id="bentoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>

    <linearGradient id="cardRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif">

    <!-- ==================== CARD 1: KATKI & GELİŞTİRME TELEMETRİSİ ==================== -->
    <g transform="translate(0, 0)">
      <rect x="0.5" y="0.5" width="627" height="203" rx="16" fill="url(#bentoBg)" stroke="url(#cardRim)" stroke-width="1.2"/>

      <text x="28" y="36" fill="#64748b" font-size="11.5" font-weight="700" letter-spacing="1.5">GELİŞTİRME AKTİVİTESİ &amp; COMMIT İVMESİ</text>
      <circle cx="596" cy="32" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Big Stat -->
      <text x="28" y="88" fill="#f8fafc" font-size="44" font-weight="800" letter-spacing="-1">1,348+</text>
      <text x="28" y="112" fill="#38bdf8" font-size="13" font-weight="600">Yıllık Kod Katkısı · Sürekli Üretim</text>

      <!-- Sub Stats -->
      <rect x="28" y="130" width="136" height="48" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="42" y="150" fill="#ffffff" font-size="15" font-weight="800">12+ Depo</text>
      <text x="42" y="167" fill="#64748b" font-size="11">Aktif Kod Tabanı</text>

      <rect x="176" y="130" width="142" height="48" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="190" y="150" fill="#38bdf8" font-size="15" font-weight="800">CI/CD Otomasyon</text>
      <text x="190" y="167" fill="#64748b" font-size="11">Otomatik Dağıtım</text>

      <!-- Activity Bar Chart -->
      <g transform="translate(336, 56)">
        <rect x="0" y="0" width="264" height="122" rx="10" fill="#060913" stroke="#162035"/>
        <text x="16" y="22" fill="#94a3b8" font-size="11" font-weight="600">Aylık Aktivite Dağılımı</text>
        <text x="248" y="22" fill="#10b981" font-size="10.5" font-weight="700" text-anchor="end">YÜKSEK</text>

        <!-- 12 Bars -->
        <g transform="translate(16, 34)">
          <rect x="0"   y="52" width="13" height="18" rx="2" fill="url(#barGrad)" opacity="0.45"/>
          <rect x="20"  y="46" width="13" height="24" rx="2" fill="url(#barGrad)" opacity="0.5"/>
          <rect x="40"  y="50" width="13" height="20" rx="2" fill="url(#barGrad)" opacity="0.5"/>
          <rect x="60"  y="40" width="13" height="30" rx="2" fill="url(#barGrad)" opacity="0.6"/>
          <rect x="80"  y="32" width="13" height="38" rx="2" fill="url(#barGrad)" opacity="0.7"/>
          <rect x="100" y="24" width="13" height="46" rx="2" fill="url(#barGrad)" opacity="0.75"/>
          <rect x="120" y="16" width="13" height="54" rx="2" fill="url(#barGrad)" opacity="0.85"/>
          <rect x="140" y="10" width="13" height="60" rx="2" fill="url(#barGrad)" opacity="0.9"/>
          <rect x="160" y="4"  width="13" height="66" rx="2" fill="url(#barGrad)"/>
          <rect x="180" y="12" width="13" height="58" rx="2" fill="url(#barGrad)" opacity="0.92"/>
          <rect x="200" y="6"  width="13" height="64" rx="2" fill="url(#barGrad)"/>
          <rect x="220" y="0"  width="13" height="70" rx="2" fill="#38bdf8"/>
        </g>
        <text x="132" y="115" fill="#475569" font-size="9" text-anchor="middle">Ara · Oca · Şub · Mar · Nis · May · Haz · Tem · Ağu · Eyl · Eki · Kas</text>
      </g>
    </g>

    <!-- ==================== CARD 2: DİL & TEKNOLOJİ ==================== -->
    <g transform="translate(652, 0)">
      <rect x="0.5" y="0.5" width="627" height="203" rx="16" fill="url(#bentoBg)" stroke="url(#cardRim)" stroke-width="1.2"/>

      <text x="28" y="36" fill="#64748b" font-size="11.5" font-weight="700" letter-spacing="1.5">MİMARİ VE TEKNOLOJİ DAĞILIMI</text>

      <!-- Segmented Bar -->
      <g transform="translate(28, 52)">
        <rect x="0"   y="0" width="248" height="8" rx="4" fill="#38bdf8"/>
        <rect x="252" y="0" width="134" height="8" rx="2" fill="#3b82f6"/>
        <rect x="390" y="0" width="102" height="8" rx="2" fill="#0284c7"/>
        <rect x="496" y="0" width="76"  height="8" rx="4" fill="#10b981"/>
      </g>

      <!-- Stack Grid -->
      <g transform="translate(28, 82)" font-size="12.5">
        <circle cx="6" cy="8" r="4.5" fill="#38bdf8"/>
        <text x="20" y="12" fill="#f8fafc" font-weight="700">JavaScript / TypeScript</text>
        <text x="232" y="12" fill="#38bdf8" font-weight="700">44%</text>
        <text x="20" y="28" fill="#64748b" font-size="11">Web Platformları &amp; Cloudflare Edge Servisleri</text>

        <circle cx="306" cy="8" r="4.5" fill="#3b82f6"/>
        <text x="320" y="12" fill="#f8fafc" font-weight="700">Modern Arayüz &amp; WebGL</text>
        <text x="536" y="12" fill="#60a5fa" font-weight="700">22%</text>
        <text x="320" y="28" fill="#64748b" font-size="11">React, Vite, Three.js ve Temiz UI</text>

        <circle cx="6" cy="56" r="4.5" fill="#0284c7"/>
        <text x="20" y="60" fill="#f8fafc" font-weight="700">Rust / C++ / Win32</text>
        <text x="232" y="60" fill="#38bdf8" font-weight="700">18%</text>
        <text x="20" y="76" fill="#64748b" font-size="11">Tauri ve Yerel Windows Masaüstü Sistemleri</text>

        <circle cx="306" cy="56" r="4.5" fill="#10b981"/>
        <text x="320" y="60" fill="#f8fafc" font-weight="700">Java / Android</text>
        <text x="536" y="60" fill="#10b981" font-weight="700">16%</text>
        <text x="320" y="76" fill="#64748b" font-size="11">Yerel Android Medya APK &amp; Dağıtım</text>
      </g>
    </g>

    <!-- ==================== CARD 3: BULUT EDGE AĞI ==================== -->
    <g transform="translate(0, 226)">
      <rect x="0.5" y="0.5" width="627" height="203" rx="16" fill="url(#bentoBg)" stroke="url(#cardRim)" stroke-width="1.2"/>

      <text x="28" y="36" fill="#64748b" font-size="11.5" font-weight="700" letter-spacing="1.5">ÇOK DÜĞÜMLÜ BULUT EDGE KÜMESİ (HA CLUSTER)</text>

      <g transform="translate(28, 52)">
        <rect x="0" y="0" width="278" height="58" rx="8" fill="#0a0f1d" stroke="#162035"/>
        <circle cx="18" cy="22" r="4" fill="#10b981"/>
        <text x="30" y="26" fill="#ffffff" font-size="12.5" font-weight="700">Node 1 · Ana Sunucu</text>
        <text x="218" y="25" fill="#10b981" font-size="10" font-weight="700">PRIMARY</text>
        <text x="30" y="44" fill="#64748b" font-size="11">kurfacore.5sarsilmaz6.workers.dev</text>

        <rect x="294" y="0" width="278" height="58" rx="8" fill="#0a0f1d" stroke="#162035"/>
        <circle cx="312" cy="22" r="4" fill="#10b981"/>
        <text x="324" y="26" fill="#ffffff" font-size="12.5" font-weight="700">Node 2 · Yedek Düğüm 1</text>
        <text x="510" y="25" fill="#38bdf8" font-size="10" font-weight="700">REPLICA</text>
        <text x="324" y="44" fill="#64748b" font-size="11">kurfacore.yedek1.workers.dev</text>

        <rect x="0" y="68" width="278" height="58" rx="8" fill="#0a0f1d" stroke="#162035"/>
        <circle cx="18" cy="90" r="4" fill="#10b981"/>
        <text x="30" y="94" fill="#ffffff" font-size="12.5" font-weight="700">Node 3 · Yedek Düğüm 2</text>
        <text x="216" y="93" fill="#38bdf8" font-size="10" font-weight="700">REPLICA</text>
        <text x="30" y="112" fill="#64748b" font-size="11">kurfacore.yedek2.workers.dev</text>

        <rect x="294" y="68" width="278" height="58" rx="8" fill="#0a0f1d" stroke="#162035"/>
        <circle cx="312" cy="90" r="4" fill="#38bdf8"/>
        <text x="324" y="94" fill="#ffffff" font-size="12.5" font-weight="700">KurfaNova · Akış Motoru</text>
        <text x="514" y="93" fill="#38bdf8" font-size="10" font-weight="700">STREAM</text>
        <text x="324" y="112" fill="#64748b" font-size="11">kurfanova.kurfa.workers.dev</text>
      </g>
    </g>

    <!-- ==================== CARD 4: ÜRETİM STANDARTLARI ==================== -->
    <g transform="translate(652, 226)">
      <rect x="0.5" y="0.5" width="627" height="203" rx="16" fill="url(#bentoBg)" stroke="url(#cardRim)" stroke-width="1.2"/>

      <text x="28" y="36" fill="#64748b" font-size="11.5" font-weight="700" letter-spacing="1.5">MÜHENDİSLİK STANDARTLARI</text>

      <g transform="translate(28, 52)">
        <rect x="0" y="0" width="278" height="58" rx="8" fill="#0a0f1d" stroke="#162035"/>
        <text x="16" y="24" fill="#38bdf8" font-size="12.5" font-weight="700">✦ Sıfır Karmaşa Tasarım</text>
        <text x="16" y="43" fill="#64748b" font-size="11">Hafif, temiz, odaklanmış kullanıcı arayüzü</text>

        <rect x="294" y="0" width="278" height="58" rx="8" fill="#0a0f1d" stroke="#162035"/>
        <text x="310" y="24" fill="#f8fafc" font-size="12.5" font-weight="700">⚡ Uçtan Uca Otomasyon</text>
        <text x="310" y="43" fill="#64748b" font-size="11">Vite derleme + Obfuscation + çoklu dağıtım</text>

        <rect x="0" y="68" width="278" height="58" rx="8" fill="#0a0f1d" stroke="#162035"/>
        <text x="16" y="92" fill="#10b981" font-size="12.5" font-weight="700">✔ 30/30 Test Süiti</text>
        <text x="16" y="111" fill="#64748b" font-size="11">Her yayın öncesi otomatik doğrulama testi</text>

        <rect x="294" y="68" width="278" height="58" rx="8" fill="#0a0f1d" stroke="#162035"/>
        <text x="310" y="92" fill="#38bdf8" font-size="12.5" font-weight="700">🌐 Çapraz Platform Senkron</text>
        <text x="310" y="111" fill="#64748b" font-size="11">Web ve yerel Android APK senkronizasyonu</text>
      </g>
    </g>

  </g>
</svg>
