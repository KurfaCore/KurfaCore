<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Ozan Sarsılmaz — Kurfa Core">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#11131c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#7b3cff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7b3cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#3d6bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3d6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="0.55" stop-color="#8a3ffc"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0.5" y="0.5" width="1279" height="299" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <rect width="1280" height="300" fill="url(#grid)"/>
    <rect width="1280" height="300" fill="url(#glowA)"/>
    <rect width="1280" height="300" fill="url(#glowB)"/>

    <!-- Abstract K mark -->
    <g transform="translate(1010 70)" opacity="0.92">
      <path d="M0 0 L34 0 L34 160 L0 160 Z" fill="url(#accent)" opacity="0.9"/>
      <path d="M44 80 L120 0 L162 0 L80 86 Z" fill="url(#accent)" opacity="0.75"/>
      <path d="M62 92 L96 66 L170 160 L126 160 Z" fill="url(#accent)" opacity="0.55"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="299" rx="22" fill="none" stroke="url(#rim)"/>

  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="98" fill="#8b93a7" font-size="17" font-weight="600" letter-spacing="4">KURFA CORE</text>
    <text x="70" y="168" fill="#f5f6fa" font-size="60" font-weight="700" letter-spacing="-1">Ozan Sarsılmaz</text>
    <rect x="72" y="192" width="56" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="232" fill="#a9b0c2" font-size="21" font-weight="400" letter-spacing="0.3">Web platforms · Android apps · Windows desktop tools</text>
  </g>
</svg>
