<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Ozan Sarsılmaz — Kurfa Core">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080f"/>
      <stop offset="0.6" stop-color="#0d0f1c"/>
      <stop offset="1" stop-color="#150d2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#6a5cff;#ff2ea6;#00e5ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff2ea6">
        <animate attributeName="stop-color" values="#ff2ea6;#00e5ff;#6a5cff;#ff2ea6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff2ea6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#6a5cff" stop-opacity="0.55"/><stop offset="1" stop-color="#6a5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.40"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#ff2ea6" stop-opacity="0.40"/><stop offset="1" stop-color="#ff2ea6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="340" rx="24"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>

    <!-- floating glow orbs -->
    <circle r="260" fill="url(#o1)" cx="1000" cy="90">
      <animateTransform attributeName="transform" type="translate" values="0 0; -90 50; 40 -20; 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="220" fill="url(#o2)" cx="1180" cy="300">
      <animateTransform attributeName="transform" type="translate" values="0 0; -120 -30; 30 -50; 0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="230" fill="url(#o3)" cx="760" cy="330">
      <animateTransform attributeName="transform" type="translate" values="0 0; 80 -40; -60 -10; 0 0" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#fff">
      <circle cx="560" cy="60" r="1.6" opacity="0.5"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="270" r="1.8" opacity="0.4"><animate attributeName="cy" values="270;245;270" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="50" r="1.4" opacity="0.5"><animate attributeName="cy" values="50;70;50" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="290" r="1.5" opacity="0.35"><animate attributeName="cy" values="290;270;290" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="170" r="1.7" opacity="0.45"><animate attributeName="cy" values="170;150;170" dur="6.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- K mark -->
    <g transform="translate(985 78)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="5s" repeatCount="indefinite"/>
        <g filter="url(#blur)" opacity="0.55">
          <path d="M0 0 L38 0 L38 184 L0 184 Z" fill="url(#accent)"/>
          <path d="M50 92 L138 0 L186 0 L92 100 Z" fill="url(#accent)"/>
          <path d="M72 106 L110 76 L196 184 L146 184 Z" fill="url(#accent)"/>
        </g>
        <path d="M0 0 L38 0 L38 184 L0 184 Z" fill="url(#accent)"/>
        <path d="M50 92 L138 0 L186 0 L92 100 Z" fill="url(#accent)" opacity="0.88"/>
        <path d="M72 106 L110 76 L196 184 L146 184 Z" fill="url(#accent)" opacity="0.7"/>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="339" rx="24" fill="none" stroke="#fff" stroke-opacity="0.1"/>

  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="76" y="92" fill="#7f8aa8" font-size="16" font-weight="700" letter-spacing="6">KURFA CORE</text>
    <text x="74" y="170" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-1.5">Ozan Sarsılmaz</text>
    <rect x="76" y="194" width="360" height="3" rx="1.5" fill="url(#line)"/>

    <!-- rotating taglines -->
    <g font-size="25" font-weight="500" fill="#c4cbe0">
      <text x="76" y="246" opacity="0">Rust ile hızlı masaüstü araçları
        <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.04;0.22;0.26;0.5;0.75;0.9;0.98;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="76" y="246" opacity="0">Cloudflare Workers üzerinde web platformları
        <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;0.24;0.28;0.30;0.47;0.51;0.75;0.98;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="76" y="246" opacity="0">KurfaNova — reklamsız müzik deneyimi
        <animate attributeName="opacity" values="0;0;0;0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.52;0.54;0.55;0.72;0.76;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="76" y="246" opacity="0">Fikirden yayına, tek başıma
        <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" keyTimes="0;0.74;0.75;0.76;0.77;0.80;0.96;1" dur="12s" repeatCount="indefinite"/></text>
    </g>

    <g font-size="14" font-weight="600" fill="#00e5ff" letter-spacing="1">
      <circle cx="82" cy="296" r="4.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="96" y="301" fill="#8b93ad" letter-spacing="1.5">YENİ ÜRÜNLER ÜZERİNDE ÇALIŞIYOR</text>
    </g>
  </g>
</svg>
