<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Ozan Sarsılmaz — Kurfa Core">
  <defs>
    <!-- Deep Space Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="60%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0e1322"/>
    </linearGradient>

    <!-- Clean Tech Accent (Electric Blue & Silver) -->
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="laserLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="ambientBlue" cx="0.85" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>

    <!-- Minimal Dot Grid -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <clipPath id="roundedFrame">
      <rect width="1280" height="340" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedFrame)">
    <rect width="1280" height="340" fill="url(#bgGrad)"/>
    <rect width="1280" height="340" fill="url(#dotGrid)"/>
    <rect width="1280" height="340" fill="url(#ambientBlue)"/>

    <!-- Top Laser Accent -->
    <rect x="0" y="0" width="1280" height="2" fill="url(#laserLine)"/>

    <!-- LEFT COLUMN: Identity & Bio -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif">
      <!-- Status Badge -->
      <g transform="translate(68, 48)">
        <rect width="280" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="16" cy="15" r="4" fill="#10b981">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="30" y="20" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5">KURFA CORE ARCHITECTURE</text>
      </g>

      <!-- Main Name -->
      <text x="66" y="136" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="-1">Ozan Sarsılmaz</text>

      <!-- Subtle Accent Line -->
      <rect x="68" y="156" width="120" height="3" rx="1.5" fill="url(#blueGlow)"/>

      <!-- Role / Bio -->
      <text x="68" y="196" fill="#e2e8f0" font-size="20" font-weight="600">Full-Stack Platformlar &amp; Yerel Sistemler</text>
      <text x="68" y="226" fill="#94a3b8" font-size="15" font-weight="400">Bulut edge servisleri, sıfır reklamlı ses motorları ve yüksek performanslı araçlar.</text>

      <!-- Quick Metrics Chips -->
      <g transform="translate(68, 258)">
        <rect x="0" y="0" width="145" height="40" rx="10" fill="#0f172a" stroke="#1e293b"/>
        <text x="16" y="25" fill="#38bdf8" font-size="13" font-weight="700">1,348+ Katkı</text>

        <rect x="157" y="0" width="145" height="40" rx="10" fill="#0f172a" stroke="#1e293b"/>
        <text x="173" y="25" fill="#f8fafc" font-size="13" font-weight="700">3 Edge Düğümü</text>

        <rect x="314" y="0" width="145" height="40" rx="10" fill="#0f172a" stroke="#1e293b"/>
        <text x="330" y="25" fill="#10b981" font-size="13" font-weight="700">Canlı Sistemler</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: Sound / Telemetry Waveform Visualizer -->
    <g transform="translate(800, 52)">
      <!-- Panel Frame -->
      <rect width="412" height="236" rx="16" fill="#0a0f1d" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Console Header -->
      <path d="M 0 16 Q 0 0 16 0 L 396 0 Q 412 0 412 16 L 412 36 L 0 36 Z" fill="#0d1424"/>
      <line x1="0" y1="36" x2="412" y2="36" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="18" r="4.5" fill="#475569"/>
      <circle cx="34" cy="18" r="4.5" fill="#475569"/>
      <circle cx="48" cy="18" r="4.5" fill="#475569"/>
      <text x="206" y="22" fill="#64748b" font-family="'Consolas', monospace" font-size="11" font-weight="600" text-anchor="middle">edge-network-telemetry.sys</text>

      <!-- Terminal content -->
      <g font-family="'Consolas', monospace" font-size="12">
        <text x="24" y="66" fill="#38bdf8">&gt; CLUSTER_NODES: ONLINE [HA_ACTIVE]</text>
        <text x="24" y="90" fill="#64748b">PRIMARY : kurfacore.5sarsilmaz6.workers.dev</text>
        <text x="24" y="110" fill="#64748b">REPLICA : kurfacore.yedek1.workers.dev</text>
        <text x="24" y="130" fill="#64748b">AUDIO   : kurfanova.stream.cluster</text>

        <!-- Dynamic Animated Equalizer Bars -->
        <g transform="translate(24, 150)">
          <rect x="0" y="0" width="364" height="64" rx="8" fill="#050811" stroke="#131c31"/>

          <!-- 24 Animated Frequency Bars -->
          <g fill="url(#blueGlow)">
            <rect x="18" y="24" width="6" height="26" rx="2"><animate attributeName="height" values="10;36;18;28;10" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="36;10;28;18;36" dur="1.2s" repeatCount="indefinite"/></rect>
            <rect x="30" y="18" width="6" height="32" rx="2"><animate attributeName="height" values="24;14;38;20;24" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="22;32;8;26;22" dur="1.5s" repeatCount="indefinite"/></rect>
            <rect x="42" y="14" width="6" height="36" rx="2"><animate attributeName="height" values="30;42;16;34;30" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="16;4;30;12;16" dur="1.1s" repeatCount="indefinite"/></rect>
            <rect x="54" y="20" width="6" height="30" rx="2"><animate attributeName="height" values="18;32;24;40;18" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="28;14;22;6;28" dur="1.4s" repeatCount="indefinite"/></rect>
            <rect x="66" y="26" width="6" height="24" rx="2"><animate attributeName="height" values="12;28;38;14;12" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="34;18;8;32;34" dur="1.3s" repeatCount="indefinite"/></rect>
            <rect x="78" y="16" width="6" height="34" rx="2"><animate attributeName="height" values="26;40;18;30;26" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="20;6;28;16;20" dur="1.6s" repeatCount="indefinite"/></rect>
            <rect x="90" y="22" width="6" height="28" rx="2"><animate attributeName="height" values="16;34;22;38;16" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="30;12;24;8;30" dur="1.2s" repeatCount="indefinite"/></rect>
            <rect x="102" y="12" width="6" height="38" rx="2"><animate attributeName="height" values="34;18;42;26;34" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="12;28;4;20;12" dur="1.4s" repeatCount="indefinite"/></rect>
            <rect x="114" y="28" width="6" height="22" rx="2"><animate attributeName="height" values="10;26;36;14;10" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="36;20;10;32;36" dur="1.7s" repeatCount="indefinite"/></rect>
            <rect x="126" y="18" width="6" height="32" rx="2"><animate attributeName="height" values="28;12;38;22;28" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="18;34;8;24;18" dur="1.3s" repeatCount="indefinite"/></rect>
            <rect x="138" y="24" width="6" height="26" rx="2"><animate attributeName="height" values="14;36;20;30;14" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="32;10;26;16;32" dur="1.5s" repeatCount="indefinite"/></rect>
            <rect x="150" y="16" width="6" height="34" rx="2"><animate attributeName="height" values="30;20;42;16;30" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="16;26;4;30;16" dur="1.1s" repeatCount="indefinite"/></rect>
            <rect x="162" y="22" width="6" height="28" rx="2"><animate attributeName="height" values="18;34;12;40;18" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="28;12;34;6;28" dur="1.6s" repeatCount="indefinite"/></rect>
            <rect x="174" y="14" width="6" height="36" rx="2"><animate attributeName="height" values="36;16;30;22;36" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="10;30;16;24;10" dur="1.2s" repeatCount="indefinite"/></rect>
            <rect x="186" y="26" width="6" height="24" rx="2"><animate attributeName="height" values="12;28;38;14;12" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="34;18;8;32;34" dur="1.4s" repeatCount="indefinite"/></rect>
            <rect x="198" y="18" width="6" height="32" rx="2"><animate attributeName="height" values="24;38;16;32;24" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="22;8;30;14;22" dur="1.3s" repeatCount="indefinite"/></rect>
            <rect x="210" y="20" width="6" height="30" rx="2"><animate attributeName="height" values="16;30;40;18;16" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="30;16;6;28;30" dur="1.5s" repeatCount="indefinite"/></rect>
            <rect x="222" y="12" width="6" height="38" rx="2"><animate attributeName="height" values="38;14;28;36;38" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="8;32;18;10;8" dur="1.1s" repeatCount="indefinite"/></rect>
          </g>

          <text x="246" y="36" fill="#38bdf8" font-size="11" font-weight="700">RTT: 12ms</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1279" height="339" rx="20" fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
