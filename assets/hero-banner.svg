<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="KURFA CORE">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0a0d1a"/>
      <stop offset="100%" stop-color="#0e0a1f"/>
    </linearGradient>

    <!-- Main Neon Gradient -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#8a3ffc"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#8a3ffc" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="wave2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#8a3ffc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <clipPath id="card">
      <rect width="1200" height="240" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Base BG -->
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect width="1200" height="240" fill="url(#grid)"/>

    <!-- Ambient Glow Orbs -->
    <circle cx="200" cy="120" r="140" fill="#00e5ff" opacity="0.12" filter="blur(40px)"/>
    <circle cx="600" cy="80" r="180" fill="#8a3ffc" opacity="0.18" filter="blur(50px)"/>
    <circle cx="1000" cy="140" r="150" fill="#ff007f" opacity="0.14" filter="blur(40px)"/>

    <!-- Animated Smooth Wave Ribbons at Bottom -->
    <g opacity="0.9">
      <!-- Wave Layer 1 -->
      <path fill="url(#wave1)">
        <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
          M 0 240 L 0 175 Q 300 135 600 175 T 1200 175 L 1200 240 Z;
          M 0 240 L 0 195 Q 300 215 600 185 T 1200 195 L 1200 240 Z;
          M 0 240 L 0 175 Q 300 135 600 175 T 1200 175 L 1200 240 Z
        "/>
      </path>

      <!-- Wave Layer 2 -->
      <path fill="url(#wave2)">
        <animate attributeName="d" dur="14s" repeatCount="indefinite" values="
          M 0 240 L 0 200 Q 350 230 700 195 T 1200 200 L 1200 240 Z;
          M 0 240 L 0 180 Q 350 150 700 185 T 1200 180 L 1200 240 Z;
          M 0 240 L 0 200 Q 350 230 700 195 T 1200 200 L 1200 240 Z
        "/>
      </path>

      <!-- Wave Stroke 1 -->
      <path fill="none" stroke="url(#neon)" stroke-width="2.5" opacity="0.8">
        <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
          M 0 175 Q 300 135 600 175 T 1200 175;
          M 0 195 Q 300 215 600 185 T 1200 195;
          M 0 175 Q 300 135 600 175 T 1200 175
        "/>
      </path>

      <!-- Wave Stroke 2 -->
      <path fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.5">
        <animate attributeName="d" dur="14s" repeatCount="indefinite" values="
          M 0 200 Q 350 230 700 195 T 1200 200;
          M 0 180 Q 350 150 700 185 T 1200 180;
          M 0 200 Q 350 230 700 195 T 1200 200
        "/>
      </path>
    </g>

    <!-- Top Neon Rim -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#neon)"/>

    <!-- Floating Particles -->
    <g fill="#ffffff">
      <circle cx="180" cy="55" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="90" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="45" r="1.8" opacity="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="80" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Center Typographic Content -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" text-anchor="middle">
      <!-- Status Tag -->
      <text x="600" y="52" fill="#00e5ff" font-size="12" font-weight="700" letter-spacing="4">SYSTEMS ARCHITECT &amp; SOFTWARE ENGINEER</text>

      <!-- Main Logo Title -->
      <text x="600" y="112" fill="url(#textGrad)" font-size="54" font-weight="900" letter-spacing="2">KURFA CORE</text>

      <!-- Subtitle -->
      <text x="600" y="146" fill="#cbd5e1" font-size="15" font-weight="500" letter-spacing="1.2">Architecting Native Systems · Edge Cloud · Modern UI</text>
    </g>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="239" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
</svg>
