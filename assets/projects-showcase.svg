<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="396" viewBox="0 0 1280 396" role="img" aria-label="Kurfa Core — Ekosistem ve Projeler Vitrini">
  <defs>
    <linearGradient id="pCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e19"/>
      <stop offset="100%" stop-color="#111526"/>
    </linearGradient>

    <linearGradient id="pRimCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="pRimPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5cff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="pRimPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2ea6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="pRimGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif">

    <!-- ==================== ROW 1 (3 CARDS) ==================== -->

    <!-- Project 1: Kurfa Core Platform -->
    <g transform="translate(0, 0)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="18" fill="url(#pCardBg)" stroke="url(#pRimCyan)" stroke-width="1.2"/>
      <rect x="24" y="22" width="128" height="24" rx="12" fill="#0f2438" stroke="#00e5ff" stroke-opacity="0.4"/>
      <text x="88" y="38" fill="#00e5ff" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">ANA PLATFORM</text>
      <circle cx="384" cy="34" r="4.5" fill="#10b981"/>

      <text x="24" y="76" fill="#ffffff" font-size="21" font-weight="800">Kurfa Core Portal</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Yüksek performanslı araçları ve web servislerini</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">tek çatı altında toplayan 3 düğümlü komuta merkezi.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="118" height="24" rx="6" fill="#151a2e"/>
      <text x="83" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Cloudflare Edge</text>
      <rect x="150" y="142" width="84" height="24" rx="6" fill="#151a2e"/>
      <text x="192" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Vite + JS</text>
      <rect x="242" y="142" width="88" height="24" rx="6" fill="#151a2e"/>
      <text x="286" y="158" fill="#00e5ff" font-size="11" font-weight="600" text-anchor="middle">Glass UI</text>
    </g>

    <!-- Project 2: KurfaNova Web -->
    <g transform="translate(434, 0)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="18" fill="url(#pCardBg)" stroke="url(#pRimPurple)" stroke-width="1.2"/>
      <rect x="24" y="22" width="136" height="24" rx="12" fill="#1e163b" stroke="#8a5cff" stroke-opacity="0.4"/>
      <text x="92" y="38" fill="#a78bfa" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">MEDYA MOTORU</text>
      <circle cx="384" cy="34" r="4.5" fill="#10b981"/>

      <text x="24" y="76" fill="#ffffff" font-size="21" font-weight="800">KurfaNova Müzik</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Hızlı, reklamsız ve kesintisiz ses akışı sağlayan</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">yeni nesil web müzik platformu ve ses motoru.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="104" height="24" rx="6" fill="#151a2e"/>
      <text x="76" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Web Audio API</text>
      <rect x="136" y="142" width="88" height="24" rx="6" fill="#151a2e"/>
      <text x="180" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">JavaScript</text>
      <rect x="232" y="142" width="104" height="24" rx="6" fill="#151a2e"/>
      <text x="284" y="158" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">Zero-Ad Stream</text>
    </g>

    <!-- Project 3: KurfaNova Android -->
    <g transform="translate(868, 0)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="18" fill="url(#pCardBg)" stroke="url(#pRimGreen)" stroke-width="1.2"/>
      <rect x="24" y="22" width="128" height="24" rx="12" fill="#0d2926" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="88" y="38" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">MOBİL İSTEMCİ</text>
      <circle cx="384" cy="34" r="4.5" fill="#10b981"/>

      <text x="24" y="76" fill="#ffffff" font-size="21" font-weight="800">KurfaNova Android</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Web platformuyla gerçek zamanlı senkronize çalışan</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">yerel Android APK ve mobil medya uygulaması.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="84" height="24" rx="6" fill="#151a2e"/>
      <text x="66" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Java SDK</text>
      <rect x="116" y="142" width="96" height="24" rx="6" fill="#151a2e"/>
      <text x="164" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Android APK</text>
      <rect x="220" y="142" width="96" height="24" rx="6" fill="#151a2e"/>
      <text x="268" y="158" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Canlı Senkron</text>
    </g>

    <!-- ==================== ROW 2 (3 CARDS) ==================== -->

    <!-- Project 4: KurfaDPI Client -->
    <g transform="translate(0, 208)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="18" fill="url(#pCardBg)" stroke="url(#pRimPink)" stroke-width="1.2"/>
      <rect x="24" y="22" width="136" height="24" rx="12" fill="#2d122b" stroke="#ff2ea6" stroke-opacity="0.4"/>
      <text x="92" y="38" fill="#f472b6" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">AĞ &amp; SİSTEM ARACI</text>

      <text x="24" y="76" fill="#ffffff" font-size="21" font-weight="800">KurfaDPI Client</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Windows için geliştirilmiş ultra hafif, hızlı</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">paket yönlendirme ve ağ optimizasyon istemcisi.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="96" height="24" rx="6" fill="#151a2e"/>
      <text x="72" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Windows x64</text>
      <rect x="128" y="142" width="88" height="24" rx="6" fill="#151a2e"/>
      <text x="172" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Win32 Native</text>
      <rect x="224" y="142" width="100" height="24" rx="6" fill="#151a2e"/>
      <text x="274" y="158" fill="#f472b6" font-size="11" font-weight="600" text-anchor="middle">Düşük Bellek</text>
    </g>

    <!-- Project 5: KurfaCode -->
    <g transform="translate(434, 208)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="18" fill="url(#pCardBg)" stroke="url(#pRimCyan)" stroke-width="1.2"/>
      <rect x="24" y="22" width="138" height="24" rx="12" fill="#0f2438" stroke="#00e5ff" stroke-opacity="0.4"/>
      <text x="93" y="38" fill="#00e5ff" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">YAPAY ZEKA &amp; DEV</text>

      <text x="24" y="76" fill="#ffffff" font-size="21" font-weight="800">KurfaCode Studio</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Yapay zeka destekli kod geliştirme, mimari tasarım</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">ve otonom dağıtım otomasyonu çalışma ortamı.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="92" height="24" rx="6" fill="#151a2e"/>
      <text x="70" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>
      <rect x="124" y="142" width="92" height="24" rx="6" fill="#151a2e"/>
      <text x="170" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">AI Workflows</text>
      <rect x="224" y="142" width="96" height="24" rx="6" fill="#151a2e"/>
      <text x="272" y="158" fill="#00e5ff" font-size="11" font-weight="600" text-anchor="middle">Obfuscation</text>
    </g>

    <!-- Project 6: Alman Otomotiv Stüdyosu -->
    <g transform="translate(868, 208)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="18" fill="url(#pCardBg)" stroke="url(#pRimPurple)" stroke-width="1.2"/>
      <rect x="24" y="22" width="128" height="24" rx="12" fill="#1e163b" stroke="#8a5cff" stroke-opacity="0.4"/>
      <text x="88" y="38" fill="#a78bfa" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">3B WEBGL SAHNE</text>

      <text x="24" y="76" fill="#ffffff" font-size="21" font-weight="800">Otomotiv Stüdyosu</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Alman otomotiv markaları için tarayıcıda çalışan</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">interaktif 3 boyutlu görselleştirme ve sunum stüdyosu.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="84" height="24" rx="6" fill="#151a2e"/>
      <text x="66" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Three.js</text>
      <rect x="116" y="142" width="84" height="24" rx="6" fill="#151a2e"/>
      <text x="158" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">WebGL 2.0</text>
      <rect x="208" y="142" width="96" height="24" rx="6" fill="#151a2e"/>
      <text x="256" y="158" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">Zero-Build</text>
    </g>

  </g>
</svg>
