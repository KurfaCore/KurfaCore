<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="396" viewBox="0 0 1280 396" role="img" aria-label="Kurfa Core — Ekosistem ve Projeler Vitrini">
  <defs>
    <linearGradient id="pCardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0e1422"/>
    </linearGradient>

    <linearGradient id="pRimBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="pRimCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="pRimEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif">

    <!-- ==================== ROW 1 (3 CARDS) ==================== -->

    <!-- Card 1: Kurfa Core Portal -->
    <g transform="translate(0, 0)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="16" fill="url(#pCardBg)" stroke="url(#pRimBlue)" stroke-width="1.2"/>
      <rect x="24" y="22" width="124" height="24" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="86" y="38" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">ANA PLATFORM</text>
      <circle cx="384" cy="34" r="4" fill="#10b981"/>

      <text x="24" y="76" fill="#f8fafc" font-size="21" font-weight="800">Kurfa Core Portal</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Tüm araç ve web servislerini tek çatı altında</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">toplayan 3 düğümlü bulut yönetim merkezi.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="114" height="24" rx="6" fill="#131b2e"/>
      <text x="81" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Cloudflare Edge</text>
      <rect x="146" y="142" width="80" height="24" rx="6" fill="#131b2e"/>
      <text x="186" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Vite + JS</text>
      <rect x="234" y="142" width="88" height="24" rx="6" fill="#131b2e"/>
      <text x="278" y="158" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Multi-Node</text>
    </g>

    <!-- Card 2: KurfaNova Müzik -->
    <g transform="translate(434, 0)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="16" fill="url(#pCardBg)" stroke="url(#pRimCyan)" stroke-width="1.2"/>
      <rect x="24" y="22" width="128" height="24" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="88" y="38" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">MEDYA PLATFORMU</text>
      <circle cx="384" cy="34" r="4" fill="#10b981"/>

      <text x="24" y="76" fill="#f8fafc" font-size="21" font-weight="800">KurfaNova Müzik</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Hızlı, reklamsız ve kesintisiz ses akışı sağlayan</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">yeni nesil web müzik platformu ve ses motoru.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="104" height="24" rx="6" fill="#131b2e"/>
      <text x="76" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Web Audio API</text>
      <rect x="136" y="142" width="88" height="24" rx="6" fill="#131b2e"/>
      <text x="180" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">JavaScript</text>
      <rect x="232" y="142" width="104" height="24" rx="6" fill="#131b2e"/>
      <text x="284" y="158" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Zero-Ad Stream</text>
    </g>

    <!-- Card 3: KurfaNova Android -->
    <g transform="translate(868, 0)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="16" fill="url(#pCardBg)" stroke="url(#pRimEmerald)" stroke-width="1.2"/>
      <rect x="24" y="22" width="124" height="24" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="86" y="38" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">MOBİL UYGULAMA</text>
      <circle cx="384" cy="34" r="4" fill="#10b981"/>

      <text x="24" y="76" fill="#f8fafc" font-size="21" font-weight="800">KurfaNova Android</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Web platformuyla eşzamanlı senkronize çalışan</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">yerel Android APK ve mobil medya oynatıcı.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="80" height="24" rx="6" fill="#131b2e"/>
      <text x="64" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Java SDK</text>
      <rect x="112" y="142" width="94" height="24" rx="6" fill="#131b2e"/>
      <text x="159" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Android APK</text>
      <rect x="214" y="142" width="96" height="24" rx="6" fill="#131b2e"/>
      <text x="262" y="158" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Canlı Senkron</text>
    </g>

    <!-- ==================== ROW 2 (3 CARDS) ==================== -->

    <!-- Card 4: KurfaDPI Client -->
    <g transform="translate(0, 208)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="16" fill="url(#pCardBg)" stroke="url(#pRimBlue)" stroke-width="1.2"/>
      <rect x="24" y="22" width="134" height="24" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="91" y="38" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">AĞ VE SİSTEM ARACI</text>

      <text x="24" y="76" fill="#f8fafc" font-size="21" font-weight="800">KurfaDPI Client</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Windows için geliştirilmiş düşük bellekli,</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">hızlı paket yönlendirme ve ağ optimizasyon aracı.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="94" height="24" rx="6" fill="#131b2e"/>
      <text x="71" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Windows x64</text>
      <rect x="126" y="142" width="84" height="24" rx="6" fill="#131b2e"/>
      <text x="168" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Win32 C++</text>
      <rect x="218" y="142" width="96" height="24" rx="6" fill="#131b2e"/>
      <text x="266" y="158" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Düşük Bellek</text>
    </g>

    <!-- Card 5: KurfaCode -->
    <g transform="translate(434, 208)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="16" fill="url(#pCardBg)" stroke="url(#pRimCyan)" stroke-width="1.2"/>
      <rect x="24" y="22" width="138" height="24" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="93" y="38" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">GELİŞTİRME &amp; OTOMASYON</text>

      <text x="24" y="76" fill="#f8fafc" font-size="21" font-weight="800">KurfaCode Studio</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Yapay zeka destekli kod geliştirme, mimari tasarım</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">ve çoklu düğüm dağıtım otomasyon ortamı.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="90" height="24" rx="6" fill="#131b2e"/>
      <text x="69" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>
      <rect x="122" y="142" width="90" height="24" rx="6" fill="#131b2e"/>
      <text x="167" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Workflows</text>
      <rect x="220" y="142" width="96" height="24" rx="6" fill="#131b2e"/>
      <text x="268" y="158" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Automations</text>
    </g>

    <!-- Card 6: Alman Otomotiv Stüdyosu -->
    <g transform="translate(868, 208)">
      <rect x="0.5" y="0.5" width="412" height="186" rx="16" fill="url(#pCardBg)" stroke="url(#pRimEmerald)" stroke-width="1.2"/>
      <rect x="24" y="22" width="124" height="24" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="86" y="38" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">3B WEBGL SAHNE</text>

      <text x="24" y="76" fill="#f8fafc" font-size="21" font-weight="800">Otomotiv Stüdyosu</text>
      <text x="24" y="102" fill="#94a3b8" font-size="13">Alman otomotiv markaları için derleme gerektirmeyen</text>
      <text x="24" y="120" fill="#94a3b8" font-size="13">tarayıcı tabanlı interaktif 3B görselleştirme.</text>

      <!-- Tech Pills -->
      <rect x="24" y="142" width="80" height="24" rx="6" fill="#131b2e"/>
      <text x="64" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Three.js</text>
      <rect x="112" y="142" width="82" height="24" rx="6" fill="#131b2e"/>
      <text x="153" y="158" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">WebGL 2.0</text>
      <rect x="202" y="142" width="94" height="24" rx="6" fill="#131b2e"/>
      <text x="249" y="158" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">Zero-Build</text>
    </g>

  </g>
</svg>
